        @font-face {

            src: url('https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/fonts/OpenDyslexic-Regular.woff2') format('woff2');
        }
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --primary: #b91c1c;
            --primary-hover: #991b1b;
            --panel-bg: #ffffff;
            --font-main: 'Lexend', sans-serif;
        }
        .high-contrast {
            --bg-color: #000000;
            --text-color: #ffffff;
            --primary: #ffeb3b;
            --primary-hover: #fdd835;
            --panel-bg: #1a1a1a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }
        .dyslexic-font {
            --font-main: 'OpenDyslexic', sans-serif;
        }
        .panel {
            background-color: var(--panel-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: var(--primary);
            color: var(--bg-color);
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        .hidden { display: none !important; }
        
        #custom-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center; z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="flex justify-between items-center mb-8 panel p-4 rounded-xl">
        <h1 class="text-xl md:text-2xl font-bold uppercase tracking-wider text-primary">Legio X - Britannia</h1>
        <div class="flex gap-4">
            <button onclick="toggleDyslexic()" class="p-2 bg-gray-200 rounded text-black font-semibold text-sm">Font Dislessia</button>
            <button onclick="toggleContrast()" class="p-2 bg-gray-800 text-white rounded font-semibold text-sm">Alto Contrasto</button>
        </div>
    </header>

    <main id="screen-start" class="flex-grow flex flex-col items-center justify-center max-w-2xl mx-auto w-full">
        <div class="panel p-8 rounded-2xl w-full text-center">
            <h2 class="text-3xl font-bold mb-4">Arruolamento</h2>
            <input type="text" id="player-name" placeholder="Inserisci il tuo nome..." class="w-full p-3 border rounded mb-4 text-black">
            <select id="difficulty-select" class="w-full p-3 border rounded mb-6 text-black">
                <option value="A2">Principiante (A2) - Traduzioni complete</option>
                <option value="B1">Guidato (B1) - Solo parole chiave</option>
                <option value="B2">Sfida (B2) - Nessuna traduzione</option>
                <option value="C1">Leggenda (C1) - Danni severi</option>
            </select>
            <button onclick="startGame()" class="w-full p-4 btn-primary rounded-xl font-bold text-lg">Inizia Campagna</button>
        </div>
    </main>

    <main id="screen-game" class="hidden flex-grow flex-col max-w-4xl mx-auto w-full">
        <div class="flex justify-between items-center mb-4 font-bold text-lg">
            <div>Legionario: <span id="ui-name" class="text-primary"></span></div>
            <div>HP Scudo: <span id="ui-hp" class="text-primary">100</span>%</div>
            <div>Punti: <span id="ui-score" class="text-primary">0</span></div>
        </div>

        <div id="story-panel" class="panel p-6 rounded-2xl mb-6">
            <h3 id="chapter-title" class="text-2xl font-bold mb-4 text-primary"></h3>
            <p id="chapter-text" class="text-lg leading-relaxed mb-6"></p>
            <div class="flex gap-4">
                <button id="btn-read" onclick="readStory()" class="flex-1 p-3 bg-blue-600 text-white rounded font-bold">Ascolta (Lettura)</button>
                <button id="btn-next-quiz" onclick="startQuiz()" class="flex-1 p-3 btn-primary rounded font-bold">Affronta il Test →</button>
            </div>
        </div>

        <div id="quiz-panel" class="hidden panel p-6 rounded-2xl">
            <div class="mb-4 text-sm font-bold text-gray-500">Domanda <span id="q-current">1</span> / <span id="q-total"></span></div>
            <h4 id="question-text" class="text-xl font-semibold mb-6"></h4>
            <div id="options-container" class="flex flex-col gap-3 mb-6"></div>
            <button id="btn-confirm" onclick="checkAnswer()" class="w-full p-4 bg-gray-300 text-gray-700 rounded font-bold cursor-not-allowed" disabled>Conferma Risposta</button>
        </div>
    </main>

    <div id="custom-modal" class="hidden">
        <div class="panel p-8 rounded-xl max-w-md text-center mx-4">
            <h3 id="modal-title" class="text-2xl font-bold mb-4"></h3>
            <p id="modal-desc" class="mb-6 whitespace-pre-wrap"></p>
            <button onclick="closeModal()" class="w-full p-3 btn-primary rounded font-bold">Continua</button>
        </div>
    </div>

                    { q: "1. (Reading) When did the Romans build the camp?", opts: ["A) Before the battle started.", "B) While they were fighting.", "C) Once the enemy had fled."], correct: 2 },
                    { q: "2. (Grammar) The Romans built a camp because the enemy ______.", opts: ["A) had ran away", "B) had fled", "C) was fled"], correct: 1 },
                    { q: "3. (Vocabulary) 'Fled' is the past participle of which verb?", opts: ["A) Fly", "B) Flow", "C) Flee"], correct: 2 },
                    { q: "4. (Error Hunt) Find the INCORRECT Past Perfect sentence:", opts: ["A) They had built a camp before sunset.", "B) By the time we arrived, they had left.", "C) Once they had secure the beach, they rested."], correct: 2 },
                    { q: "5. (Transformation) Change to a question: 'The Romans had secured the beach.'", opts: ["A) Had the Romans secured the beach?", "B) Did the Romans had secured the beach?", "C) Had the Romans secure the beach?"], correct: 0 }
                ],
                B2: [
                    { q: "1. (Inference) 'The Roman Eagle had landed' is a metaphor meaning:", opts: ["A) A real bird flew onto the beach.", "B) Roman authority and military presence were established on the island.", "C) The Romans had lost their standard."], correct: 1 },
                    { q: "2. (Grammar/Chronology) Which action happened FIRST?", opts: ["A) The sun set.", "B) The Romans secured the beach.", "C) They happened at exactly the same time."], correct: 1 },
                    { q: "3. (Vocabulary) To 'secure' a beach in a military context means:", opts: ["A) To make it safe from enemy attack and establish control.", "B) To tie the boats tightly to the rocks.", "C) To clean the sand."], correct: 0 },
                    { q: "4. (Error Hunt) Spot the error in sequence of tenses:", opts: ["A) After they had built the camp, they slept.", "B) They secured the beach before the sun had set.", "C) By the time the enemy fled, the Romans have built a camp."], correct: 2 },
                    { q: "5. (Transformation) Rewrite using 'After': 'Once the enemy had fled, they built a camp.'", opts: ["A) After the enemy had fled, they built a camp.", "B) After the enemy fled, they had built a camp.", "C) After the enemy fleeing, they built a camp."], correct: 0 }
                ],
                C1: [
                    { q: "1. (Inference) The contrast between 'Albion was not conquered' and 'the Eagle had landed' establishes:", opts: ["A) Total defeat for the Romans.", "B) A successful tactical bridgehead despite the lack of a strategic conquest.", "C) A mutiny within the Tenth Legion."], correct: 1 },
                    { q: "2. (Grammar/Inversion) Choose the correct formal inversion:", opts: ["A) Barely they had secured the beach when the sun set.", "B) Barely had they secured the beach when the sun set.", "C) Had they barely secured the beach when the sun set."], correct: 1 },
                    { q: "3. (Vocabulary/Syntax) 'By the time' triggers which tense to describe the earlier completed action?", opts: ["A) Past Continuous", "B) Present Perfect", "C) Past Perfect"], correct: 2 },
                    { q: "4. (Error Hunt) Identify the subtle flaw in aspect:", opts: ["A) They had been securing the beach when the sun set.", "B) Having fled, the enemy was no longer a threat.", "C) They had secured the beach, which allowed them to build a camp."], correct: 0 },
                    { q: "5. (Transformation) Advanced participle clause: 'Because they had secured the beach, they rested.'", opts: ["A) Having secured the beach, they rested.", "B) Being secured the beach, they rested.", "C) Had secured the beach, they rested."], correct: 0 }
                ]
            }
        }

    let gameState = {
        name: "", difficulty: "A2", hp: 100, score: 0, currentChapter: 0,
        chapterErrors: 0, chapterTotalQuestions: 0, hpSnapshot: 100, scoreSnapshot: 0
    };

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let selectedOptionIndex = null;
    let correctAnswerIndex = null;

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function toggleDyslexic() {
        document.body.classList.toggle('dyslexic-font');
        localStorage.setItem('dyslexic', document.body.classList.contains('dyslexic-font'));
    }

    function toggleContrast() {
        document.body.classList.toggle('high-contrast');
        localStorage.setItem('contrast', document.body.classList.contains('high-contrast'));
    }

    function loadSettings() {
        if (localStorage.getItem('dyslexic') === 'true') document.body.classList.add('dyslexic-font');
        if (localStorage.getItem('contrast') === 'true') document.body.classList.add('high-contrast');
        const savedName = localStorage.getItem('playerName');
        if (savedName) document.getElementById('player-name').value = savedName;
    }

    function showModal(title, desc, callback = null) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('custom-modal').classList.remove('hidden');
        document.getElementById('custom-modal').dataset.callback = callback ? callback.name : "";
    }

    function closeModal() {
        document.getElementById('custom-modal').classList.add('hidden');
        const callbackName = document.getElementById('custom-modal').dataset.callback;
        if (callbackName === "resetChapter") resetChapter();
        else if (callbackName === "nextChapter") nextChapter();
    }

    function startGame() {
        const name = document.getElementById('player-name').value.trim() || "Legionario";
        localStorage.setItem('playerName', name);
        
        gameState.name = name;
        gameState.difficulty = document.getElementById('difficulty-select').value;
        gameState.hp = 100;
        gameState.score = 0;
        gameState.currentChapter = 0;

        document.getElementById('ui-name').innerText = name;
        updateUI();

        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        
        loadChapter();
    }

    function updateUI() {
        document.getElementById('ui-hp').innerText = gameState.hp;
        document.getElementById('ui-score').innerText = gameState.score;
        if (gameState.hp <= 0) {
            showModal("Sconfitta!", "I Britanni hanno infranto le tue linee. La Legione si ritira.", resetGame);
        }
    }

    function loadChapter() {
        if (gameState.currentChapter >= storyData.length) {
            showModal("Campagna Completata!", `TESTA DI PONTE STABILITA.\n\nPunteggio Finale: ${gameState.score}\nHP Rimanenti: ${gameState.hp}%\n\nL'Aquila Romana è su Albion!`, resetGame);
            return;
        }

        const chapter = storyData[gameState.currentChapter];
        gameState.hpSnapshot = gameState.hp;
        gameState.scoreSnapshot = gameState.score;
        gameState.chapterErrors = 0;

        document.getElementById('chapter-title').innerText = chapter.title;
        document.getElementById('chapter-text').innerText = chapter.text;
        
        document.getElementById('story-panel').classList.remove('hidden');
        document.getElementById('quiz-panel').classList.add('hidden');
    }

    function readStory() {
        const text = document.getElementById('chapter-text').innerText;
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'en-GB';
        window.speechSynthesis.speak(speech);
    }

    function startQuiz() {
        window.speechSynthesis.cancel();
        document.getElementById('story-panel').classList.add('hidden');
        document.getElementById('quiz-panel').classList.remove('hidden');

        const chapter = storyData[gameState.currentChapter];
        let rawQuestions = chapter.quizzes[gameState.difficulty];
        currentQuestions = rawQuestions.map(rq => {
            let optionsObj = rq.opts.map((opt, index) => ({ text: opt, isCorrect: index === rq.correct }));
            return { q: rq.q, opts: shuffleArray(optionsObj) };
        });

        gameState.chapterTotalQuestions = currentQuestions.length;
        currentQuestionIndex = 0;
        showQuestion();
    }

    function showQuestion() {
        selectedOptionIndex = null;
        document.getElementById('btn-confirm').disabled = true;
        document.getElementById('btn-confirm').classList.replace('btn-primary', 'bg-gray-300');
        document.getElementById('btn-confirm').classList.add('cursor-not-allowed');

        document.getElementById('q-current').innerText = currentQuestionIndex + 1;
        document.getElementById('q-total').innerText = currentQuestions.length;

        const qData = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = qData.q;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        qData.opts.forEach((opt, index) => {
            if(opt.isCorrect) correctAnswerIndex = index;
            
            const btn = document.createElement('button');
            btn.className = 'w-full p-4 text-left border-2 rounded-xl transition-all hover:border-primary focus:outline-none';
            let cleanText = opt.text.replace(/^[A-D]\)\s*/, '');
            btn.innerText = cleanText;
            btn.onclick = () => selectOption(index, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(index, btnNode) {
        selectedOptionIndex = index;
        const buttons = document.getElementById('options-container').children;
        for (let b of buttons) {
            b.classList.remove('border-primary', 'bg-red-50');
        }
        btnNode.classList.add('border-primary', 'bg-red-50');
        
        const confirmBtn = document.getElementById('btn-confirm');
        confirmBtn.disabled = false;
        confirmBtn.classList.replace('bg-gray-300', 'btn-primary');
        confirmBtn.classList.remove('cursor-not-allowed');
    }

    function checkAnswer() {
        const isCorrect = selectedOptionIndex === correctAnswerIndex;
        
        if (isCorrect) {
            gameState.score += (gameState.difficulty === 'C1' ? 20 : 10);
            showModal("Corretto!", "Avanzi sul campo di battaglia.");
        } else {
            gameState.chapterErrors++;
            
            // LOGICA DANNI CALIBRATA
            let damage = 3; 
            if (gameState.difficulty === 'C1') damage = 10;
            else if (gameState.difficulty === 'B2') damage = 5;
            else if (gameState.difficulty === 'A2') damage = 1;
            
            gameState.hp -= damage;
            const correctText = currentQuestions[currentQuestionIndex].opts[correctAnswerIndex].text.replace(/^[A-D]\)\s*/, '');
            showModal("Sbagliato!", `Subisci ${damage} danni.\nLa risposta corretta era:\n"${correctText}"`);
        }
        
        updateUI();
        currentQuestionIndex++;

        if (currentQuestionIndex < currentQuestions.length && gameState.hp > 0) {
            setTimeout(showQuestion, 200);
        } else if (gameState.hp > 0) {
            evaluateChapter();
        }
    }

    function evaluateChapter() {
        const accuracy = ((gameState.chapterTotalQuestions - gameState.chapterErrors) / gameState.chapterTotalQuestions) * 100;
        
        if (accuracy >= 60) {
            gameState.currentChapter++;
            showModal("Capitolo Superato!", `Accuratezza: ${Math.round(accuracy)}%\nLa Legione avanza!`, nextChapter);
        } else {
            showModal("Ritirata Strategica", `Accuratezza: ${Math.round(accuracy)}% (Richiesto 60%).\nDevi riorganizzare le truppe e riprovare l'assalto.`, resetChapter);
        }
    }

    function nextChapter() {
        loadChapter();
    }

    function resetChapter() {
        gameState.hp = gameState.hpSnapshot;
        gameState.score = gameState.scoreSnapshot;
        updateUI();
        loadChapter();
    }

    function resetGame() {
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-start').classList.remove('hidden');
    }

    window.onload = loadSettings;
</script>
