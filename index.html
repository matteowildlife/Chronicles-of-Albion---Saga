<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronicles of Albion: Episode 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Fauna+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fauna One', serif; background-color: #080c14; color: #e2e8f0; transition: font-size 0.2s ease; overflow-x: hidden; }
        h1, h2, h3, h4, .font-cinzel { font-family: 'Cinzel', serif; }
        
        .bg-hero {
            background: linear-gradient(to bottom, rgba(8, 12, 20, 0.8), rgba(8, 12, 20, 0.95));
        }

        .parchment { 
            background: linear-gradient(145deg, #121929 0%, #0d1322 100%); 
            border: 1px solid rgba(212, 175, 55, 0.35); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
        }
        
        .gold-text { color: #f3e5ab; }
        
        .gold-button {
            background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #996515 100%);
            color: #000; font-weight: bold; transition: all 0.3s ease; cursor: pointer;
        }
        .gold-button:hover {
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #b8860b 100%);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transform: translateY(-1px);
        }

        /* ACCESSIBILITÀ E MODALITÀ DISLESSIA FORZATA SU MOBILE E PC */
        body.dyslexia-font, body.dyslexia-font * { font-family: 'Comic Sans MS', 'Arial', sans-serif !important; letter-spacing: 0.05em !important; word-spacing: 0.1em !important; }
        body.high-contrast { background-color: #000000 !important; color: #ffffff !important; }
        body.high-contrast .parchment { background: #0a0a0a !important; border: 2px solid #ffff00 !important; }

        /* HOVER E TOUCH INTERATTIVO CON DURATA CONFIGURABILE */
        .word-interactive {
            position: relative;
            display: inline-block;
            cursor: pointer;
            border-bottom: 1px dotted rgba(212, 175, 55, 0.5);
            transition: all 0.15s ease-in-out;
            padding: 0 1px;
        }
        .word-interactive:hover, .word-interactive.active-touch {
            color: #f3e5ab;
            background-color: rgba(212, 175, 55, 0.25);
            border-radius: 3px;
        }
        .word-interactive .tooltip-box {
            visibility: hidden;
            width: max-content;
            max-width: 220px;
            background-color: #060a12;
            color: #f3e5ab;
            text-align: center;
            border: 1px solid #d4af37;
            border-radius: 6px;
            padding: 5px 9px;
            position: absolute;
            z-index: 100;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            font-size: 0.78rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
            pointer-events: none;
            font-family: sans-serif;
            line-height: 1.3;
        }
        .word-interactive .tooltip-box::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #d4af37 transparent transparent transparent;
        }
        .word-interactive:hover .tooltip-box,
        .word-interactive.active-touch .tooltip-box {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6 bg-hero">

    <!-- HEADER DI GIOCO -->
    <header class="flex justify-between items-center pb-3 border-b border-yellow-900/40 max-w-5xl mx-auto w-full px-2">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-yellow-950/90 border-2 border-yellow-500/70 flex items-center justify-center p-1.5 shadow-lg relative overflow-hidden">
                <span class="text-xl md:text-2xl relative z-10">🦅</span>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-bold tracking-wider gold-text font-cinzel">CHRONICLES OF ALBION</h1>
                <p id="player-welcome-sub" class="text-xs text-gray-400">Legionario/a: <span id="header-player-name" class="text-yellow-400">Novizio</span></p>
            </div>
        </div>
        <div id="header-score-box" class="hidden text-xs font-cinzel bg-gray-900/90 border border-yellow-600/40 px-3 py-1.5 rounded">
            PUNTEGGIO: <span id="high-score" class="text-yellow-400 font-bold">0 / 21</span>
        </div>
    </header>

    <!-- HOMEPAGE & ARRUOLAMENTO IMMERSIVO -->
    <main id="screen-menu" class="my-auto max-w-5xl mx-auto w-full py-4 px-2">
        
        <div class="parchment p-5 md:p-8 rounded-xl border border-yellow-600/40 mb-4 md:mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                
                <!-- Immagine bilanciata su PC e Mobile -->
                <div class="flex flex-col justify-center">
                    <div class="rounded-lg border-2 border-yellow-600/60 shadow-2xl bg-slate-950 overflow-hidden
